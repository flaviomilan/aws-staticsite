name: Maintain existing state backend
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  backend:
    uses: ./.github/workflows/infrastructure.yml
    with:
      kit-repository: ${{ github.repository }}
      kit-ref: ${{ github.sha }}
      site-id: terraform-state
      environment: bootstrap
      working-directory: bootstrap
      backend-config-file: backend.hcl
      var-file: bootstrap.hcl
      apply: true
    secrets: inherit
