name: Reusable infrastructure
on:
  workflow_call:
    inputs:
      kit-repository:
        type: string
        default: flaviomilan/aws-staticsite
      kit-ref:
        description: Immutable kit commit SHA, matching the workflow version being called.
        type: string
        required: true
      aws-role-arn:
        description: OIDC role ARN; explicit input takes precedence over legacy secrets.
        type: string
        default: ''
      site-id:
        type: string
        required: true
      environment:
        type: string
        required: true
      aws-region:
        type: string
        default: us-east-1
      working-directory:
        type: string
        required: true
      backend-config-file:
        description: Path relative to the Terraform working directory; must set use_lockfile=true.
        type: string
        required: true
      var-file:
        description: Optional non-secret Terraform variable file, relative to the working directory.
        type: string
        default: ''
      dns-zone-id:
        description: Existing Route53 zone to verify before a site apply; empty for DNS/backend configuration only.
        type: string
        default: ''
      apply:
        type: boolean
        default: false
    secrets:
      AWS_ROLE_ARN:
        required: false
      AWS_ACCESS_KEY_ID:
        required: false
      AWS_SECRET_ACCESS_KEY:
        required: false
    outputs:
      bucket-id:
        value: ${{ jobs.apply.outputs.bucket-id }}
      release-bucket-id:
        value: ${{ jobs.apply.outputs.release-bucket-id }}
      distribution-id:
        value: ${{ jobs.apply.outputs.distribution-id }}
      site-url:
        value: ${{ jobs.apply.outputs.site-url }}
permissions:
  contents: read
  id-token: write
concurrency:
  group: infrastructure-${{ github.repository }}-${{ inputs.site-id }}-${{ inputs.environment }}
  cancel-in-progress: false
env:
  TF_IN_AUTOMATION: 'true'
  TF_INPUT: 'false'
  AWS_ROLE_ARN: ${{ inputs.aws-role-arn || secrets.AWS_ROLE_ARN }}
  TF_DIR: ${{ inputs.working-directory }}
  BACKEND_FILE: ${{ inputs.backend-config-file }}
  VAR_FILE: ${{ inputs.var-file }}
jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      changes: ${{ steps.plan.outputs.changes }}
    steps:
      - name: Require immutable kit version
        env:
          KIT_REF: ${{ inputs.kit-ref }}
        run: '[[ "$KIT_REF" =~ ^[0-9a-f]{40}$ ]]'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.kit-repository }}
          ref: ${{ inputs.kit-ref }}
          path: .static-site-kit
          persist-credentials: false
      - name: Configure AWS via OIDC
        if: env.AWS_ROLE_ARN != ''
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ inputs.aws-region }}
      - name: Configure legacy credentials (migration only)
        if: env.AWS_ROLE_ARN == ''
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ inputs.aws-region }}
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: 1.10.5
          terraform_wrapper: false
      - name: Require remote state and lock
        run: python3 .static-site-kit/scripts/check_backend.py "$TF_DIR" "$BACKEND_FILE"
      - name: Initialize
        run: terraform -chdir="$TF_DIR" init -lockfile=readonly -backend-config="$BACKEND_FILE"
      - name: Plan
        id: plan
        run: |
          var_args=()
          if [ -n "$VAR_FILE" ]; then var_args+=("-var-file=$VAR_FILE"); fi
          set +e
          terraform -chdir="$TF_DIR" plan -lock-timeout=5m -detailed-exitcode -out=reviewed.tfplan "${var_args[@]}" > "$TF_DIR/plan.txt" 2>&1
          status=$?
          set -e
          cat "$TF_DIR/plan.txt"
          if [ "$status" = 1 ]; then exit 1; fi
          if [ "$status" != 0 ] && [ "$status" != 2 ]; then exit "$status"; fi
          echo "changes=$status" >> "$GITHUB_OUTPUT"
          terraform -chdir="$TF_DIR" show -json reviewed.tfplan | python3 .static-site-kit/scripts/check_plan.py
          printf '%s' "$GITHUB_SHA" > "$TF_DIR/plan-commit.txt"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: plan-${{ inputs.site-id }}-${{ inputs.environment }}-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 1
          if-no-files-found: error
          path: |
            ${{ inputs.working-directory }}/reviewed.tfplan
            ${{ inputs.working-directory }}/plan.txt
            ${{ inputs.working-directory }}/plan-commit.txt
  apply:
    if: inputs.apply && github.event_name != 'pull_request' && github.event_name != 'pull_request_target'
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: ${{ inputs.environment }}
    outputs:
      bucket-id: ${{ steps.outputs.outputs.bucket-id }}
      release-bucket-id: ${{ steps.outputs.outputs.release-bucket-id }}
      distribution-id: ${{ steps.outputs.outputs.distribution-id }}
      site-url: ${{ steps.outputs.outputs.site-url }}
    steps:
      - name: Require immutable kit version
        env:
          KIT_REF: ${{ inputs.kit-ref }}
        run: '[[ "$KIT_REF" =~ ^[0-9a-f]{40}$ ]]'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.kit-repository }}
          ref: ${{ inputs.kit-ref }}
          path: .static-site-kit
          persist-credentials: false
      - name: Configure AWS via OIDC
        if: env.AWS_ROLE_ARN != ''
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ inputs.aws-region }}
      - name: Configure legacy credentials (migration only)
        if: env.AWS_ROLE_ARN == ''
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ inputs.aws-region }}
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: 1.10.5
          terraform_wrapper: false
      - name: Require remote state and lock
        run: python3 .static-site-kit/scripts/check_backend.py "$TF_DIR" "$BACKEND_FILE"
      - name: Initialize
        run: terraform -chdir="$TF_DIR" init -lockfile=readonly -backend-config="$BACKEND_FILE"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: plan-${{ inputs.site-id }}-${{ inputs.environment }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ inputs.working-directory }}
      - name: Verify reviewed plan commit
        run: test "$(cat "$TF_DIR/plan-commit.txt")" = "$GITHUB_SHA"
      - name: Verify DNS delegation
        if: inputs.dns-zone-id != ''
        env:
          ZONE_ID: ${{ inputs.dns-zone-id }}
        run: |
          aws route53 get-hosted-zone --id "$ZONE_ID" > "$RUNNER_TEMP/zone.json"
          python3 .static-site-kit/scripts/check_dns_from_json.py "$RUNNER_TEMP/zone.json"
      - name: Apply reviewed plan
        run: terraform -chdir="$TF_DIR" apply -lock-timeout=5m reviewed.tfplan
      - name: Export publication outputs
        id: outputs
        run: |
          terraform -chdir="$TF_DIR" output -json > "$RUNNER_TEMP/outputs.json"
          python3 .static-site-kit/scripts/workflow_outputs.py "$RUNNER_TEMP/outputs.json"
