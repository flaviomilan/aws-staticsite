version: 2
updates:
  - package-ecosystem: "terraform"
    directory: "/src"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "terraform"
    groups:
      terraform-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "terraform"
    directory: "/bootstrap"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "terraform"
    groups:
      bootstrap-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "actions"
    groups:
      actions-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "terraform"
    directory: "/modules/static-site"
    schedule:
      interval: "weekly"

  - package-ecosystem: "terraform"
    directory: "/modules/github-oidc"
    schedule:
      interval: "weekly"

  - package-ecosystem: "terraform"
    directory: "/examples/existing-zone"
    schedule:
      interval: "weekly"

  - package-ecosystem: "terraform"
    directory: "/examples/production"
    schedule:
      interval: "weekly"

  - package-ecosystem: "terraform"
    directory: "/examples/dns"
    schedule:
      interval: "weekly"

  - package-ecosystem: "npm"
    directory: "/examples/astro"
    schedule:
      interval: "weekly"

  - package-ecosystem: terraform
    directory: /examples/github-oidc
    schedule:
      interval: weekly
